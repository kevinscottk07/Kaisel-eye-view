<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Kaisel's Eyes</title>
  <defs>
    <linearGradient id="kaiselFlame" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaffff" />
      <stop offset="0.35" stop-color="#7af9ff" />
      <stop offset="0.7" stop-color="#00d4ff" />
      <stop offset="1" stop-color="#0a4f7a" />
    </linearGradient>
    <radialGradient id="kaiselCore" cx="100" cy="112" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bff6ff" stop-opacity="0.8" />
      <stop offset="0.6" stop-color="#00a2d6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#00a2d6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kaiselEye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#9df6ff" />
      <stop offset="1" stop-color="#00d4ff" />
    </radialGradient>
    <filter id="kaiselGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ambient energy core -->
  <circle cx="100" cy="112" r="68" fill="url(#kaiselCore)" />

  <!-- Shadow-wyvern crest: a symmetric right half, mirrored for the left.
       Drawn as angular membrane wings rising from a central serpentine head. -->
  <g fill="url(#kaiselFlame)" filter="url(#kaiselGlow)">
    <g>
      <!-- upper wing -->
      <path d="M100 96 L128 70 L124 84 L150 58 L146 76 L176 52 L164 78 L186 70 L160 96 L180 94 L150 112 L168 116 L132 120 L140 108 L112 114 Z" />
      <!-- lower wing claw -->
      <path d="M118 120 L150 128 L138 134 L164 136 L142 148 L120 138 Z" opacity="0.92" />
      <!-- mirrored left -->
      <path transform="translate(200,0) scale(-1,1)" d="M100 96 L128 70 L124 84 L150 58 L146 76 L176 52 L164 78 L186 70 L160 96 L180 94 L150 112 L168 116 L132 120 L140 108 L112 114 Z" />
      <path transform="translate(200,0) scale(-1,1)" d="M118 120 L150 128 L138 134 L164 136 L142 148 L120 138 Z" opacity="0.92" />
    </g>

    <!-- central head / neck: a lean serpentine wyvern facing forward -->
    <path d="M100 42
             L108 58 L104 70 L112 84 L106 96
             L116 112 L108 128 L114 150 L100 176
             L86 150 L92 128 L84 112 L94 96
             L88 84 L96 70 L92 58 Z" />
    <!-- horns -->
    <path d="M92 58 L82 40 L95 52 Z" />
    <path d="M108 58 L118 40 L105 52 Z" />
  </g>

  <!-- the eyes -->
  <g filter="url(#kaiselGlow)">
    <ellipse cx="92" cy="86" rx="4.6" ry="6.6" fill="url(#kaiselEye)" transform="rotate(18 92 86)" />
    <ellipse cx="108" cy="86" rx="4.6" ry="6.6" fill="url(#kaiselEye)" transform="rotate(-18 108 86)" />
    <circle cx="92" cy="86" r="1.5" fill="#021a26" />
    <circle cx="108" cy="86" r="1.5" fill="#021a26" />
  </g>
</svg>
